{% extends 'base.html' %}
{% block title %}Оплата заказа{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h2 class="mb-0"><i class="bi bi-credit-card"></i> Оплата заказа</h2>
                </div>

                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i> Все платежи защищены SSL-шифрованием
                        </div>

                        <div class="mb-3">
                            <label for="cardNumber" class="form-label fw-bold">Номер карты</label>
                            <input type="text" class="form-control" id="cardNumber"
                                   placeholder="0000 0000 0000 0000" pattern="[0-9\s]{16,19}"
                                   maxlength="19" required>
                            <div class="form-text">Введите 16-19 цифр без пробелов</div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="expiryDate" class="form-label fw-bold">Срок действия</label>
                                <input type="text" class="form-control" id="expiryDate"
                                       placeholder="ММ/ГГ" pattern="(0[1-9]|1[0-2])\/([0-9]{2})"
                                       maxlength="5" required>
                            </div>
                            <div class="col-md-6">
                                <label for="cvvCode" class="form-label fw-bold">CVV-код</label>
                                <input type="text" class="form-control" id="cvvCode"
                                       placeholder="000" pattern="[0-9]{3}" maxlength="3" required>
                                <div class="form-text">3 цифры на обороте карты</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="nameOnCard" class="form-label fw-bold">Имя владельца карты</label>
                            <input type="text" class="form-control" id="nameOnCard"
                                   placeholder="IVAN IVANOV" required>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="termsCheckbox" required>
                            <label class="form-check-label" for="termsCheckbox">
                                Я согласен с <a href="#">условиями обработки персональных данных</a>
                            </label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-lock-fill"></i> Подтвердить оплату
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-light text-center">
                    <small class="text-muted">
                        <i class="bi bi-shield-check"></i> Безопасные платежи через защищенное соединение
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 15px;
    }
    .form-control {
        border-radius: 8px;
        padding: 12px;
    }
    .btn {
        border-radius: 8px;
        padding: 12px;
    }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
{% endblock %}
